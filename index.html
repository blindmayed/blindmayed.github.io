<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blind Mayed</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap');

  :root{
    --bg: #06110c;
    --bg2: #0a1a13;
    --line: #1c3327;
    --ink: #eef3ee;
    --dim: #7d9188;
    --accent: #2f9e6e;
    --accent2: #c9d9c9;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{ height:100%; }

  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
    position:relative;
    overflow:hidden;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 44px 44px;
    background-position: -1px -1px;
  }

  body::before{
    content:"";
    position:absolute;
    inset:0;
    background: radial-gradient(circle at 50% 38%, rgba(47,158,110,0.08), transparent 55%);
    pointer-events:none;
  }

  /* corner crosshair marks, purely decorative */
  .cross{
    position:absolute;
    width: 18px;
    height: 18px;
    opacity: 0.35;
  }
  .cross::before, .cross::after{
    content:"";
    position:absolute;
    background: var(--dim);
  }
  .cross::before{ width:100%; height:1px; top:50%; left:0; }
  .cross::after{ width:1px; height:100%; left:50%; top:0; }
  .cross.tl{ top: 8%; left: 10%; }
  .cross.tr{ top: 8%; right: 10%; }
  .cross.bl{ bottom: 12%; left: 10%; }
  .cross.br{ bottom: 12%; right: 10%; }

  .card{
    position:relative;
    text-align:center;
    max-width: 460px;
    width:100%;
    z-index:1;
  }

  .avatar{
    width: 150px;
    height: 240px;
    margin: 0 auto 30px;
    border-radius: 24px;
    background: linear-gradient(155deg, var(--bg2), #061a12);
    border: 1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    box-shadow: 0 0 0 6px rgba(47,158,110,0.10), 0 0 36px -10px rgba(47,158,110,0.35);
  }
  .avatar img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 15%;
  }

  h1{
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(2.4rem, 9vw, 3.6rem);
    letter-spacing: -0.01em;
    line-height: 1;
  }
  h1 .b1{ color: var(--accent); }
  h1 .b2{ color: var(--ink); }

  .subtitle{
    margin-top: 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 14px;
    font-size: 0.8rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .subtitle .sep{
    width:1px;
    height: 14px;
    background: var(--line);
  }
  .subtitle .hi{ color: var(--accent); }

  .pill{
    margin: 34px auto 0;
    display:inline-flex;
    align-items:center;
    gap: 4px;
    padding: 10px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(14,30,24,0.6);
    backdrop-filter: blur(4px);
  }

  .pill a{
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    transition: background .2s ease, transform .2s ease;
  }
  .pill a:hover{ transform: translateY(-2px); }
  .pill a svg{
    width: 18px;
    height: 18px;
    fill: var(--dim);
    transition: fill .2s ease;
  }
  .pill a:hover svg{ fill: var(--ink); }

  .pill .divider{
    width:1px;
    height: 18px;
    background: var(--line);
    margin: 0 4px;
  }

  .pill a.ig:hover{ background: #E1306C; }
  .pill a.tiktok:hover{ background: #010101; }
  .pill a.tiktok:hover svg{ fill: #2f9e6e; }
  .pill a.snap:hover{ background: #FFFC00; }
  .pill a.snap:hover svg{ fill: #14121a; }
  .pill a.tg:hover{ background: #229ED9; }
  .pill a.x:hover{ background: #000000; }
  .pill a.wa:hover{ background: #25D366; }

  .foot{
    margin-top: 60px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 8px;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    color: var(--dim);
  }
  .foot svg{ width: 14px; height:14px; fill: var(--accent); }

  @media (prefers-reduced-motion: reduce){
    .pill a{ transition:none; }
  }
</style>
</head>
